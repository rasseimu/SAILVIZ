<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SailViz — GPS軌跡ビューア</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="view-home">
  <section id="home-screen">
    <header id="home-bar">
      <strong>SailViz</strong>
      <a id="home-dashboard-link" class="home-link" title="全艇チューニングを見比べる">🔧 チューニングダッシュボード</a>
      <a id="home-progress-link" class="home-link" title="部員ごとの練習進捗を見る">📈 練習進捗管理</a>
      <span id="home-folder"></span>
    </header>
    <div id="home-body">
      <div id="home-toolbar">
        <button id="home-new" class="gd-new"><span class="gd-plus">＋</span> 新規練習</button>
        <span id="home-section-title">練習データ</span>
      </div>
      <div id="home-cards"></div>
    </div>
  </section>

  <section id="dashboard-screen">
    <header id="dashboard-bar">
      <a id="dashboard-home-link" class="home-link" title="ホームへ戻る">← ホーム</a>
      <img id="dashboard-icon" src="src/Component 2.png" alt="" />
      <strong id="dashboard-title">全艇チューニングダッシュボード</strong>
      <div id="dashboard-legend"></div>
    </header>
    <div id="dashboard-body">
      <nav id="dashboard-nav"></nav>
      <div id="dashboard-content">
        <div id="dashboard-stage">
          <div id="dashboard-charts"></div>
        </div>
        <div id="dashboard-table"></div>
        <canvas id="dashboard-timebar"></canvas>
        <section id="windaxis-section" class="hidden">
          <h3 id="windaxis-title">風軸（推定風向）</h3>
          <div id="windaxis-wrap">
            <canvas id="windaxis-chart"></canvas>
          </div>
          <p id="windaxis-empty" class="hidden">タック・ジャイブが検出されませんでした（推定できませんでした）</p>
        </section>
      </div>
    </div>
    <div id="dashboard-chart-modal" class="hidden">
      <div class="dcm-inner">
        <div id="dcm-bar">
          <strong id="dashboard-modal-title"></strong>
          <button id="dashboard-modal-close" title="閉じる (Esc)">×</button>
        </div>
        <div id="dcm-body"><canvas id="dashboard-modal-canvas"></canvas></div>
      </div>
    </div>
  </section>

  <section id="progress-screen">
    <header id="progress-bar">
      <a id="progress-home-link" class="home-link" title="ホームへ戻る">← ホーム</a>
      <strong id="progress-title">練習進捗管理</strong>
    </header>
    <nav id="progress-nav"></nav>
    <div id="progress-content"></div>
  </section>

  <section id="import-modal" class="hidden">
    <div class="im-inner">
      <div id="im-bar">
        <strong>議事録から一括取込</strong>
        <span id="import-wind"></span>
        <button id="import-run">取込</button>
        <button id="import-cancel">閉じる</button>
      </div>
      <div class="im-input">
        <label class="btn">議事録ファイルを選択
          <input type="file" id="import-file" accept=".md,.txt" hidden />
        </label>
        <span class="im-or">または貼り付け ↓</span>
        <textarea id="import-text" rows="6" placeholder="## 名前（フルネーム）&#10;- **今日の目標**：…&#10;- **課題**：…&#10;- **発見**：…"></textarea>
      </div>
      <div id="import-preview"></div>
    </div>
  </section>

  <header id="topbar">
    <strong id="app-title" title="ホームへ戻る">SailViz</strong>
    <label class="btn">CSV読込
      <input type="file" id="file-input" accept=".csv" multiple hidden />
    </label>
    <button id="folder-import" class="btn" title="同期フォルダから、GPS範囲内の動画を自動取込">📁 動画フォルダ取込</button>
    <button id="project-save" class="btn" title="現在の状態を保存フォルダに書き出す">💾 保存</button>
    <label>過去の練習:
      <select id="practice-select">
        <option value="">（練習を選択…）</option>
      </select>
    </label>
    <label>整列:
      <select id="align-mode">
        <option value="absolute">絶対時刻</option>
        <option value="elapsed">経過時間</option>
      </select>
    </label>
    <label><input type="checkbox" id="accuracy-filter" checked /> 精度フィルタ</label>
    <span id="status"></span>
  </header>

  <main>
    <aside id="sidebar">
      <div id="viz-sections">
        <h2>トラック</h2>
        <div id="track-list"></div>
        <h2>タグ</h2>
        <div id="tag-list"></div>
        <h2>マーク</h2>
        <div id="mark-list"></div>
        <h2>動画</h2>
        <div id="video-list"></div>
      </div>
      <h2>反省</h2>
      <button id="reflection-add" class="side-add">＋ 反省を追加</button>
      <button id="reflection-import" class="side-add" title="振り返り議事録を部員別に一括取込">📋 議事録から一括取込</button>
      <div id="reflection-list"></div>
    </aside>
    <section id="stage">
      <canvas id="map"></canvas>
      <div id="rotate-control" title="マップを回転">
        <span id="rotate-label">0°</span>
        <input type="range" id="rotate-slider" min="0" max="360" step="1" value="0" />
        <button id="rotate-reset" title="北上に戻す">⟲</button>
      </div>
      <div id="drop-zone">CSV / 動画をここにドラッグ&ドロップ</div>
      <div id="mark-menu" class="hidden">
        <button data-shape="triangle" data-color="#e02020"><span style="color:#e02020">▲</span> 赤三角</button>
        <button data-shape="triangle" data-color="#f1c40f"><span style="color:#f1c40f">▲</span> 黄三角</button>
        <button data-shape="circle" data-color="#e02020"><span style="color:#e02020">●</span> 赤丸</button>
        <button data-shape="circle" data-color="#f1c40f"><span style="color:#f1c40f">●</span> 黄丸</button>
      </div>
    </section>
    <aside id="video-panel" class="hidden">
      <div id="video-bar">
        <span id="video-name"></span>
        <button id="video-rotate" title="90°回転">⟳</button>
        <button id="video-delete" title="この動画を削除">🗑</button>
        <button id="video-close" title="閉じる (Esc)">×</button>
      </div>
      <div id="video-stage"><video id="video-el" controls></video></div>
    </aside>
  </main>

  <section id="reflection-editor" class="hidden">
    <div id="refl-bar">
      <strong id="refl-title">反省を記入</strong>
      <span id="refl-hint">＠で部員をメンション・動画リストのクリックで動画をメンション</span>
      <button id="refl-save">保存</button>
      <button id="refl-cancel">破棄</button>
    </div>
    <div id="refl-input-wrap">
      <textarea id="refl-text" rows="3" placeholder="今日の反省…（@ で部員、動画リストのクリックで動画をメンション）"></textarea>
      <ul id="refl-mention" class="hidden"></ul>

      <details class="refl-section" open>
        <summary>艇セッティング</summary>
        <div id="refl-rig" class="refl-grid"></div>
      </details>

      <details class="refl-section">
        <summary>天候</summary>
        <div class="refl-grid">
          <label>風向 <select id="refl-wind-dir"></select></label>
          <label>風速 <input id="refl-wind-speed" type="number" step="0.1" min="0" /> m/s</label>
          <label>波高 <input id="refl-waveHeight" type="number" step="0.1" min="0" /> m</label>
        </div>
        <span id="refl-wind-src"></span>
      </details>

      <details class="refl-section">
        <summary>反省内容</summary>
        <div id="refl-notes" class="refl-notes"></div>
      </details>
    </div>
  </section>

  <div id="color-menu" class="hidden"></div>

  <footer id="transport">
    <button id="play-btn">▶</button>
    <label>速度:
      <select id="speed-select">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </label>
    <span id="clock">--:--:--</span>
    <canvas id="timeline"></canvas>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>

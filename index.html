<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SailViz — GPS軌跡ビューア</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <strong>SailViz</strong>
    <label class="btn">CSV読込
      <input type="file" id="file-input" accept=".csv" multiple hidden />
    </label>
    <button id="folder-import" class="btn" title="同期フォルダから、GPS範囲内の動画を自動取込">📁 動画フォルダ取込</button>
    <label>整列:
      <select id="align-mode">
        <option value="absolute">絶対時刻</option>
        <option value="elapsed">経過時間</option>
      </select>
    </label>
    <label><input type="checkbox" id="accuracy-filter" checked /> 精度フィルタ</label>
    <span id="status"></span>
  </header>

  <main>
    <aside id="sidebar">
      <h2>トラック</h2>
      <div id="track-list"></div>
      <h2>タグ</h2>
      <div id="tag-list"></div>
      <h2>マーク</h2>
      <div id="mark-list"></div>
      <h2>動画</h2>
      <div id="video-list"></div>
      <h2>反省</h2>
      <button id="reflection-add" class="side-add">＋ 反省を追加</button>
      <div id="reflection-list"></div>
    </aside>
    <section id="stage">
      <canvas id="map"></canvas>
      <div id="drop-zone">CSV / 動画をここにドラッグ&ドロップ</div>
      <div id="mark-menu" class="hidden">
        <button data-shape="triangle" data-color="#e02020"><span style="color:#e02020">▲</span> 赤三角</button>
        <button data-shape="triangle" data-color="#f1c40f"><span style="color:#f1c40f">▲</span> 黄三角</button>
        <button data-shape="circle" data-color="#e02020"><span style="color:#e02020">●</span> 赤丸</button>
        <button data-shape="circle" data-color="#f1c40f"><span style="color:#f1c40f">●</span> 黄丸</button>
      </div>
    </section>
    <aside id="video-panel" class="hidden">
      <div id="video-bar">
        <span id="video-name"></span>
        <button id="video-delete" title="この動画を削除">🗑</button>
        <button id="video-close" title="閉じる (Esc)">×</button>
      </div>
      <video id="video-el" controls></video>
    </aside>
  </main>

  <section id="reflection-editor" class="hidden">
    <div id="refl-bar">
      <strong id="refl-title">反省を記入</strong>
      <span id="refl-hint">＠で部員をメンション・動画リストのクリックで動画をメンション</span>
      <label class="refl-wind-field">風向
        <select id="refl-wind-dir"></select>
      </label>
      <label class="refl-wind-field">風速
        <input id="refl-wind-speed" type="number" step="0.1" min="0" /> m/s
      </label>
      <span id="refl-wind-src"></span>
      <button id="refl-save">保存</button>
      <button id="refl-cancel">破棄</button>
    </div>
    <div id="refl-input-wrap">
      <textarea id="refl-text" rows="3" placeholder="今日の反省…（@ で部員、動画リストのクリックで動画をメンション）"></textarea>
      <ul id="refl-mention" class="hidden"></ul>
    </div>
  </section>

  <footer id="transport">
    <button id="play-btn">▶</button>
    <label>速度:
      <select id="speed-select">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </label>
    <span id="clock">--:--:--</span>
    <canvas id="timeline"></canvas>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
